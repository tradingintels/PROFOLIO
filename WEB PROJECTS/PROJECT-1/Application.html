<!DOCTYPE html>
<html>

        <title> Application</title>
        <link rel="stylesheet" href="MITC.css">  
    </head>
    <body >

        <header>
                <img src="Untitled-1.png" alt="logo" class="i">
                <nav>
                    <center>
                    <a href="mitcs.html">HOME</a>
                    <a href="ABOUT US.html" target="_blank">ABOUT US</a>
                    <a href="COURSES.html" target="_blank">OUR COURSES</a>
                    <a href="Application.html" target="_blank"> APPLICATION</a>
                    <a href="#ContactUs" target="_blank">CONTACT US</a>
                    </center>
                </nav>
            </header>
        <div id="App-gen">

            <form action="Register">
                <div id="App-form">
                    <p class="app-form">Register</p>
                <div class="reg">
                    <label for="Fname">FIRST NAME:</label>
                    <input type="text" required placeholder="e.g Joe">
                </div>

                <div class="reg">
                    <label for="Lname"> LAST NAME:</label>
                    <input type="text" required placeholder="e.g John">
                </div>

                <div class="reg">
                    <label for="Uname"> USERNAME:</label>
                    <input type="text" required placeholder="e.g johnjoe111">
                </div>

                <div class="reg">
                    <label for="E-mail"> E-MAIL:</label>
                    <input type="email" required placeholder="e.g aabbcc@gmail.com">
                </div>

                <div class="reg">
                    <label for="Passord"> PASSWORD:</label>
                    <input type="password" required placeholder="e.g joh123joe" minlength="8" maxlength="16">
                </div>

                <button type="submit" class="Register">Register</button>
                
                <p class="Go">Already own an account?<a href="Log-In.html">LOG-IN</a></p>
            </form>
        </div>

        </div>
    </body>
</html>
